name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage -- tests/unit/
        env:
          NODE_ENV: test
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          TIMEZONE: Asia/Taipei

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  deploy:
    name: Deploy to Zeabur
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Zeabur deployment
        # Zeabur also auto-deploys via GitHub integration.
        # This step provides an explicit trigger after tests pass, but is optional.
        # To enable: set ZEABUR_WEBHOOK_URL in repo secrets (Zeabur dashboard → Service → Settings → Deploy Hooks).
        run: |
          if [ -z "${{ secrets.ZEABUR_WEBHOOK_URL }}" ]; then
            echo "ℹ️ ZEABUR_WEBHOOK_URL 未設定，跳過 webhook 觸發（Zeabur 將透過 GitHub 整合自動部署）"
            exit 0
          fi
          curl -s -X POST "${{ secrets.ZEABUR_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "main"}' \
            -f || { echo "❌ Zeabur webhook 觸發失敗"; exit 1; }
          echo "✅ Zeabur 部署已觸發"
